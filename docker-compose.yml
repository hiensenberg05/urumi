# =================================================================
# URUMI ENTERPRISE MCP GATEWAY & STORE PLATFORM
# Production & VPS Deployment Docker Compose Specification
# =================================================================
version: "3.8"

networks:
  urumi-net:
    driver: bridge

volumes:
  mariadb_data:
  wordpress_data:
  redis_data:

services:
  # -----------------------------------------------------------------
  # 1. State & Cache Infrastructure
  # -----------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: urumi-mariadb
    restart: unless-stopped
    networks:
      - urumi-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-mariadb_root_password_123}
      MYSQL_DATABASE: ${MARIADB_DATABASE:-wordpress}
      MYSQL_USER: ${MARIADB_USER:-wordpress}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD:-wp_secure_password_123}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: urumi-redis
    restart: unless-stopped
    networks:
      - urumi-net
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # -----------------------------------------------------------------
  # 2. WordPress + WooCommerce Storefront
  # -----------------------------------------------------------------
  wordpress:
    image: wordpress:6.7-php8.2-apache
    container_name: urumi-wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      urumi-net:
        aliases:
          - store.local
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MARIADB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MARIADB_PASSWORD:-wp_secure_password_123}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://store.local');
        define('WP_SITEURL', 'http://store.local');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wordpress_data:/var/www/html

  # -----------------------------------------------------------------
  # 3. Upstream FastMCP Servers
  # -----------------------------------------------------------------
  woocommerce-mcp:
    image: hiensenbergg/woocommerce-mcp:v1.1.0
    container_name: urumi-woocommerce-mcp
    restart: unless-stopped
    depends_on:
      - wordpress
    networks:
      - urumi-net
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      WC_URL: http://wordpress
      WC_HOST_HEADER: store.local
      WC_VERIFY_SSL: "false"
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-ck_98fbc18596f264871d8717904e5d61483acfb0a1}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-cs_12cda47b1981cb02720b08051a8bc8f895f3b7d1}

  inventory-mcp:
    image: hiensenbergg/inventory-mcp:v1.1.1
    container_name: urumi-inventory-mcp
    restart: unless-stopped
    networks:
      - urumi-net
    ports:
      - "8002:8002"
    environment:
      PORT: 8002

  analytics-mcp:
    image: hiensenbergg/analytics-mcp:v1.1.0
    container_name: urumi-analytics-mcp
    restart: unless-stopped
    depends_on:
      - wordpress
    networks:
      - urumi-net
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      WC_URL: http://wordpress
      WC_HOST_HEADER: store.local
      WC_VERIFY_SSL: "false"
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-ck_98fbc18596f264871d8717904e5d61483acfb0a1}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-cs_12cda47b1981cb02720b08051a8bc8f895f3b7d1}

  hosted-currency:
    image: hiensenbergg/hosted-mcp:v1.0.0
    container_name: urumi-hosted-currency
    restart: unless-stopped
    networks:
      - urumi-net
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      SERVICE_TYPE: currency

  hosted-notifications:
    image: hiensenbergg/hosted-mcp:v1.0.0
    container_name: urumi-hosted-notifications
    restart: unless-stopped
    networks:
      - urumi-net
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      SERVICE_TYPE: notifications

  # -----------------------------------------------------------------
  # 4. Central MCP Gateway (Unified Reverse Proxy, Auth, Rate Limiter)
  # -----------------------------------------------------------------
  gateway:
    image: hiensenbergg/mcp-gateway:v1.6.7
    container_name: urumi-gateway
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      woocommerce-mcp:
        condition: service_started
      inventory-mcp:
        condition: service_started
      analytics-mcp:
        condition: service_started
    networks:
      urumi-net:
        aliases:
          - gateway.local
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      GATEWAY_HOST: "0.0.0.0"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8004/api/v1/agent/chat
      UPSTREAM_WOOCOMMERCE_URL: http://woocommerce-mcp:8001/mcp
      UPSTREAM_INVENTORY_URL: http://inventory-mcp:8002/mcp
      UPSTREAM_ANALYTICS_URL: http://analytics-mcp:8003/mcp
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-key-urumi-2026}
      JWT_SECRET: ${JWT_SECRET:-urumi-jwt-production-secret-evaluator-2026}

  # -----------------------------------------------------------------
  # 5. AI Copilot Service (ReAct Agent Engine)
  # -----------------------------------------------------------------
  ai-service:
    image: hiensenbergg/ai-service:v1.3.6
    container_name: urumi-ai-service
    restart: unless-stopped
    networks:
      - urumi-net
    ports:
      - "8004:8004"
    environment:
      AI_SERVICE_PORT: 8004
      AI_SERVICE_HOST: "0.0.0.0"
      GATEWAY_URL: http://gateway:8000
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-openai/gpt-oss-20b}

  # -----------------------------------------------------------------
  # 6. Web Management Console (React / Vite Frontend)
  # -----------------------------------------------------------------
  frontend:
    image: hiensenbergg/frontend:v1.0.0
    container_name: urumi-frontend
    restart: unless-stopped
    depends_on:
      - gateway
    networks:
      - urumi-net
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
