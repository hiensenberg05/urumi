apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: store-provisioner
rules:
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources:
      - namespaces
      - pods
      - pods/log
      - pods/status
      - services
      - deployments
      - secrets
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      - networkpolicies
      - ingresses
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: store-provisioner-binding
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
roleRef:
  kind: ClusterRole
  name: store-provisioner
  apiGroup: rbac.authorization.k8s.io
