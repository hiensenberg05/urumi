{{- if and .Values.mcpServers.enabled .Values.mcpServers.inventory.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-mcp
  labels:
    app.kubernetes.io/name: inventory-mcp
    app.kubernetes.io/component: mcp-server
spec:
  replicas: {{ .Values.mcpServers.inventory.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-mcp
        app.kubernetes.io/component: mcp-server
    spec:
      containers:
        - name: inventory-mcp
          image: "{{ .Values.mcpServers.inventory.image.repository }}:{{ .Values.mcpServers.inventory.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServers.inventory.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpServers.inventory.port }}
          env:
            - name: PORT
              value: "{{ .Values.mcpServers.inventory.port }}"
            - name: WC_URL
              value: "http://wordpress.{{ .Release.Namespace }}.svc.cluster.local"
            - name: WC_HOST_HEADER
              value: "store.local"
            - name: WC_VERIFY_SSL
              value: "false"
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-keys
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-keys
                  key: WC_CONSUMER_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.mcpServers.inventory.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-mcp
  labels:
    app.kubernetes.io/name: inventory-mcp
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpServers.inventory.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: inventory-mcp
{{- end }}
