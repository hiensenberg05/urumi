{{- if .Values.aiService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-agent
spec:
  replicas: {{ .Values.aiService.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai-agent
    spec:
      containers:
        - name: ai-service
          image: "{{ .Values.aiService.image.repository }}:{{ .Values.aiService.image.tag }}"
          imagePullPolicy: {{ .Values.aiService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.aiService.port }}
          env:
            - name: AI_SERVICE_PORT
              value: "{{ .Values.aiService.port }}"
            - name: AI_SERVICE_HOST
              value: "0.0.0.0"
            - name: GATEWAY_URL
              value: "http://gateway.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.port }}"
            - name: LLM_MODEL
              value: "{{ .Values.aiService.groq.model }}"
            - name: FALLBACK_MODEL
              value: "{{ .Values.aiService.groq.fallbackModel }}"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: GROQ_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.aiService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-agent
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.aiService.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: ai-service
{{- end }}
