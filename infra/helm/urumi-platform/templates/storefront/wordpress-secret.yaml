{{- if .Values.storefront.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-secret
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: storefront
type: Opaque
stringData:
  admin-password: {{ .Values.storefront.wordpress.adminPassword | quote }}
  db-password: {{ .Values.storefront.mariadb.password | quote }}
{{- end }}
