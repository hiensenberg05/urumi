{{- if .Values.storefront.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: storefront
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/part-of: storefront
    spec:
      containers:
        - name: wordpress
          image: "{{ .Values.storefront.wordpress.image.repository }}:{{ .Values.storefront.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.storefront.wordpress.image.pullPolicy }}
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.storefront.mariadb.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.storefront.mariadb.user | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secret
                  key: db-password
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $http_host = isset($_SERVER['HTTP_HOST']) ? $_SERVER['HTTP_HOST'] : '{{ .Values.storefront.wordpress.siteUrl }}';
                define('WP_HOME', 'http://' . $http_host);
                define('WP_SITEURL', 'http://' . $http_host);
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $_SERVER['HTTPS'] = 'on';
                }
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /var/www/html
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.storefront.wordpress.resources | nindent 12 }}
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: wordpress-pvc
{{- end }}
