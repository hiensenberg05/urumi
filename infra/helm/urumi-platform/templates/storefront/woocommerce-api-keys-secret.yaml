{{- if .Values.storefront.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-api-keys
  labels:
    app.kubernetes.io/name: woocommerce
    app.kubernetes.io/part-of: storefront
type: Opaque
stringData:
  WC_URL: "http://wordpress"
  WC_CONSUMER_KEY: {{ .Values.storefront.woocommerce.consumerKey | quote }}
  WC_CONSUMER_SECRET: {{ .Values.storefront.woocommerce.consumerSecret | quote }}
{{- end }}
