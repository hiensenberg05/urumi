{{- if .Values.storefront.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/part-of: storefront
type: Opaque
stringData:
  mariadb-root-password: {{ default (randAlphaNum 24) .Values.storefront.mariadb.rootPassword | quote }}
  mariadb-password: {{ default (randAlphaNum 24) .Values.storefront.mariadb.password | quote }}
{{- end }}
