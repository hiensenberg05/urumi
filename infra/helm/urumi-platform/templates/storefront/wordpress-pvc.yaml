{{- if .Values.storefront.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-pvc
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: storefront
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storefront.wordpress.storage }}
{{- end }}
