{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp-gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: mcp-gateway
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: GATEWAY_PORT
              value: "{{ .Values.gateway.port }}"
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: UPSTREAM_WOOCOMMERCE_URL
              value: "http://woocommerce-mcp.{{ .Release.Namespace }}.svc.cluster.local:8001/mcp"
            - name: UPSTREAM_INVENTORY_URL
              value: "http://inventory-mcp.{{ .Release.Namespace }}.svc.cluster.local:8002/mcp"
            - name: UPSTREAM_ANALYTICS_URL
              value: "http://analytics-mcp.{{ .Release.Namespace }}.svc.cluster.local:8003/mcp"
            - name: RATE_LIMIT_PER_MINUTE
              value: "{{ .Values.gateway.rateLimit.perMinute }}"
            - name: RATE_LIMIT_BURST
              value: "{{ .Values.gateway.rateLimit.burst }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp-gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: gateway
---
{{- if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: mcp-gateway
  annotations:
    kubernetes.io/ingress.class: {{ .Values.gateway.ingress.className | quote }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-API-Key"
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  {{- if and .Values.gateway.ingress.tls .Values.gateway.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.gateway.ingress.host }}
        - {{ .Values.storefront.ingress.host }}
      secretName: {{ .Values.gateway.ingress.tls.secretName | default "gateway-tls-cert" }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.port }}
    - host: {{ .Values.storefront.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.port }}
{{- end }}
{{- end }}
